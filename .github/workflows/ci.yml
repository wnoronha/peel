name: CI

on:
  push:
    branches: [ main, master, 'v*', 'release/*' ]
  pull_request:
    branches: [ main, master, 'v*', 'release/*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Vet code
        run: go vet ./...

      - name: Run unit tests
        run: go test -v ./...

      - name: Build local binary
        run: make build

      - name: Verify cross-compilation
        env:
          CGO_ENABLED: 0
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            echo "Verifying build for ${target}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -o /dev/null .
          done
